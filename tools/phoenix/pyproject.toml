[project]
name = "rosa-evaluation-phoenix"
version = "0.1.0"
description = "Local Phoenix server and separate ROSA evaluation tools"
requires-python = ">=3.12,<3.13"
dependencies = ["arize-phoenix==20.23.0", "arize-phoenix-client==3.5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
phoenix-local = "rosa_phoenix.server:main"

[tool.setuptools]
packages = ["rosa_phoenix"]
package-dir = {rosa_phoenix = "."}
